server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Global proxy timeouts — generous to handle slow health checks
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_http_version    1.1;

    # Static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE stream — must come BEFORE /api/ to take priority
    # Needs infinite read timeout and no buffering
    location /api/agent/stream {
        proxy_pass              http://backend:8000/api/agent/stream;
        proxy_set_header        Host $host;
        proxy_set_header        Connection "";
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      86400s;
        chunked_transfer_encoding on;
    }

    # All other API + health requests
    location ~ ^/(api|health) {
        proxy_pass              http://backend:8000;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        Connection        "";
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      300s;
        proxy_connect_timeout   15s;
    }
}
