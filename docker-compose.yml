services:

  ollama:
    image: ollama/ollama:latest
    container_name: crossroad_ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:11434/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [crossroad_net]

  ollama-init:
    image: ollama/ollama:latest
    container_name: crossroad_ollama_init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "ollama pull ${OLLAMA_MODEL:-qwen2.5:7b} && echo '✅ Model ready'"
    environment:
      OLLAMA_HOST: "0.0.0.0:${OLLAMA_PORT}"
    networks: [crossroad_net]

  neo4j:
    image: neo4j:5.23-community
    container_name: crossroad_neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_BROWSER_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-crossroad2025}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks: [crossroad_net]

  postgres:
    image: postgres:16-alpine
    container_name: crossroad_postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: crossroad
      POSTGRES_USER: crossroad
      POSTGRES_PASSWORD: "${PG_PASSWORD:-crossroad2025}"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossroad -d crossroad"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [crossroad_net]

  redis:
    image: redis:7-alpine
    container_name: crossroad_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [crossroad_net]

  # ChromaDB: NO healthcheck — the heartbeat endpoint path changes between versions.
  # Backend handles ChromaDB connection failures gracefully (vector features degrade).
  chromadb:
    image: chromadb/chroma:latest
    container_name: crossroad_chroma
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ALLOW_RESET: "true"
      ANONYMIZED_TELEMETRY: "false"
    networks: [crossroad_net]

  # Backend starts when neo4j+postgres+redis are healthy.
  # Does NOT wait for Ollama or ChromaDB — those degrade gracefully.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossroad_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-crossroad2025}"
      PG_DSN: "postgresql://crossroad:${PG_PASSWORD:-crossroad2025}@postgres:5432/crossroad"
      REDIS_URL: "redis://redis:6379/0"
      CHROMA_HOST: "chromadb"
      CHROMA_PORT: "8000"
      OLLAMA_HOST: "0.0.0.0:${OLLAMA_PORT}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      AUTO_START_CRAWLER: "${AUTO_START_CRAWLER:-false}"
      CRAWL_DELAY_SECONDS: "1.5"
      AGENT_L1_CONCURRENCY: "4"
      AGENT_L2_CONCURRENCY: "3"
      AGENT_L3_CONCURRENCY: "2"
      # Force model caches outside the /app volume mount
      # This prevents file-write events from interfering with the process
      TRANSFORMERS_CACHE: "/root/.cache/huggingface"
      HF_HOME: "/root/.cache/huggingface"
      SENTENCE_TRANSFORMERS_HOME: "/root/.cache/sentence_transformers"
      TORCH_HOME: "/root/.cache/torch"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # chromadb and ollama are NOT hard dependencies
    volumes:
      - ./backend:/app
      # Cache dirs outside /app so file changes don't affect the process
      - st_cache:/root/.cache/huggingface
      - st_cache:/root/.cache/torch
      - st_cache:/root/.cache/sentence_transformers
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 90s
    networks: [crossroad_net]

  # Frontend starts as soon as backend container exists (not necessarily healthy).
  # nginx will retry the backend proxy until it's ready.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crossroad_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks: [crossroad_net]

volumes:
  ollama_models:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  pg_data:
  redis_data:
  chroma_data:
  st_cache:      # sentence-transformers + HuggingFace model cache

networks:
  crossroad_net:
    driver: bridge
